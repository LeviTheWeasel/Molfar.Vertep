<title>Kingmaker Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one readable chronicle column; rail of sections on wide screens, bottom tabs on a phone;
   the ruler's sheet is a side column from 1100 px. Colours are the shell's tokens (Vertep, light). */
:root{
  --deep:#07080b;--base:#0b0c11;--panel:#0e1016;--raised:#12141c;--ink:#f0e9dc;--muted:#a9b1c4;--faint:#7e859a;
  --line:#2a2f3d;--accent:#e2213a;--cta:#39d5ff;--cta-ink:#07080b;--tonal:rgb(57 213 255 / .12);
  --danger:#f2777a;--danger-soft:rgb(242 119 122 / .16);--success:#7fd18b;--success-soft:rgb(127 209 139 / .14);
  --warning:#e3b341;--warning-soft:rgb(227 179 65 / .14);--hover:rgb(240 233 220 / .06);
  --prose:"Literata",Georgia,"Times New Roman",serif;--ui:"Manrope",system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --deep:#f4f4f6;--base:#ffffff;--panel:#fafafb;--raised:#ffffff;--ink:#17171a;--muted:#5a5a63;--faint:#74747e;
  --line:#e2e2e7;--accent:#c41a30;--cta:#2f5fbf;--cta-ink:#ffffff;--tonal:rgb(47 95 191 / .1);
  --danger:#c4373a;--danger-soft:rgb(196 55 58 / .12);--success:#2f7d3f;--success-soft:rgb(47 125 63 / .12);
  --warning:#9a6f0a;--warning-soft:rgb(154 111 10 / .12);--hover:rgb(0 0 0 / .05);color-scheme:light}}
:root[data-theme="light"]{
  --deep:#f4f4f6;--base:#ffffff;--panel:#fafafb;--raised:#ffffff;--ink:#17171a;--muted:#5a5a63;--faint:#74747e;
  --line:#e2e2e7;--accent:#c41a30;--cta:#2f5fbf;--cta-ink:#ffffff;--tonal:rgb(47 95 191 / .1);
  --danger:#c4373a;--danger-soft:rgb(196 55 58 / .12);--success:#2f7d3f;--success-soft:rgb(47 125 63 / .12);
  --warning:#9a6f0a;--warning-soft:rgb(154 111 10 / .12);--hover:rgb(0 0 0 / .05);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--deep);color:var(--ink);font:14px/1.5 var(--ui)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:1fr;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{display:none}
.main{min-width:0;max-width:720px;width:100%;margin:0 auto;padding-block:12px 150px;display:flex;flex-direction:column;gap:16px}
.side{display:none}
/* header */
.head{display:flex;flex-direction:column;gap:8px}
.head-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.world{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;font-weight:600}
.world small{color:var(--faint);font-weight:500}
.turn{color:var(--muted);font-size:13px;text-align:right}
.who{font-family:var(--prose);font-size:20px;font-weight:600;text-wrap:balance}
.marks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.mark{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.res div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.res b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.res span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res i{font-style:normal;font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--success)}.down{color:var(--danger)}
/* prose */
.prose{font-family:var(--prose);font-size:16px;line-height:1.65;max-width:65ch}
.prose p+p{margin-top:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
h2{font-family:var(--prose);font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:700}
.sec{display:flex;flex-direction:column;gap:12px}
/* matter card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .from{font-size:12px;color:var(--faint)}
.card .txt{font-family:var(--prose);font-size:15px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
.opt:hover:not(:disabled){background:var(--hover)}
.opt b{font-weight:600}
.opt .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.chip{border-radius:999px;padding:1px 8px;border:1px solid var(--line);white-space:nowrap}
.chip.risk{border-color:var(--warning);background:var(--warning-soft);color:var(--warning)}
.chip.roll{border-color:var(--line)}
.own{display:flex;gap:8px}
.own input{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;min-height:44px}
.btn{border:1px solid var(--line);background:none;border-radius:8px;padding:10px 14px;min-height:44px;font-weight:600}
.btn:hover{background:var(--hover)}
.btn.tonal{background:var(--tonal);border-color:var(--cta);color:var(--cta)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink);font-weight:700}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.chosen{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--tonal);border:1px solid var(--cta);border-radius:8px;padding:10px 12px}
.chosen span{min-width:0}
.note{font-size:13px;color:var(--muted)}
.callout{border:1px solid var(--warning);background:var(--warning-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.callout.bad{border-color:var(--danger);background:var(--danger-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* bottom bar */
.cta-bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--deep) 40%);padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;z-index:5}
.cta-bar .btn{width:100%;max-width:720px;min-height:48px;font-size:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--base);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs button,.rail button{background:none;border:0;min-height:56px;font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button[aria-current="page"],.rail button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
.tabs svg,.rail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* lists */
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.bar{display:flex;gap:3px}
.bar i{width:18px;height:8px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--accent)}
.person{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.ava{width:40px;height:40px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-family:var(--prose)}
.loy{font-variant-numeric:tabular-nums;font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps li{display:grid;grid-template-columns:20px 1fr;gap:8px}
.steps .ok{color:var(--success)}.steps .no{color:var(--faint)}
.doors{display:grid;gap:12px}
.door{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;min-height:44px}
.door:hover{background:var(--hover)}
.door b{font-size:16px}
.door span{color:var(--muted)}
textarea{width:100%;min-height:96px;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink);font:15px/1.5 var(--ui);resize:vertical}
.pick{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;min-height:40px}
.pick[aria-pressed="true"]{border-color:var(--cta);background:var(--tonal);color:var(--cta)}
.say{align-self:flex-end;background:var(--tonal);border-radius:12px 12px 2px 12px;padding:10px 14px;max-width:85%}
.band{font-weight:700}
.band.full{color:var(--success)}.band.part{color:var(--warning)}.band.miss{color:var(--danger)}
.rumour{border-left:2px solid var(--line);padding-left:12px;font-family:var(--prose);font-style:italic;color:var(--muted)}
@media (min-width:860px){
  .app{grid-template-columns:200px minmax(0,1fr);gap:24px}
  .rail{display:flex;flex-direction:column;gap:4px;padding-block:16px;position:sticky;top:0;align-self:start}
  .rail .brand{font-family:var(--prose);font-size:18px;font-weight:600;padding:8px 12px 16px}
  .rail button{flex-direction:row;justify-content:flex-start;gap:10px;min-height:44px;padding:0 12px;border-radius:8px;font-size:14px}
  .rail button[aria-current="page"]{box-shadow:inset 2px 0 0 var(--accent);background:var(--hover)}
  .tabs{display:none}
  .main{padding-block:16px 110px}
  .cta-bar{bottom:0;left:224px;padding-bottom:16px}
}
@media (min-width:1140px){
  .app{grid-template-columns:200px minmax(0,1fr) 300px}
  .side{display:flex;flex-direction:column;gap:12px;padding-block:16px;position:sticky;top:0;align-self:start}
  .cta-bar{right:324px}
}
@media (max-width:420px){.res{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{transform:translateY(4px)}to{transform:none}}}
</style>

<div class="app">
  <nav class="rail" aria-label="Розділи">
    <div class="brand">Kingmaker <span class="note">макет</span></div>
    <div id="railBtns"></div>
  </nav>

  <main class="main" id="main"></main>

  <aside class="side" id="side"></aside>
</div>
<div class="cta-bar" id="ctaBar" hidden><button class="btn primary" id="cta"></button></div>
<nav class="tabs" id="tabs" aria-label="Розділи"></nav>

<script>
// Clickable mock: sample world, fixed dice, no engine. State lives in memory only.
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const ICON = {
  throne: '<svg viewBox="0 0 24 24"><path d="M4 18h16M5 18l-1-9 4.5 4L12 6l3.5 7L20 9l-1 9"/></svg>',
  court: '<svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M3 19c.6-3 3-4.5 6-4.5s5.4 1.5 6 4.5M16 6.5a2.5 2.5 0 010 5M18 14.8c1.6.6 2.6 2 3 4.2"/></svg>',
  factions: '<svg viewBox="0 0 24 24"><path d="M6 21V4M6 5h11l-2.5 3.5L17 12H6"/></svg>',
  realm: '<svg viewBox="0 0 24 24"><path d="M4 20V9l4-3 4 3v11M12 20v-7h8v7M3 20h18M8 12v2M8 16v2"/></svg>',
  chron: '<svg viewBox="0 0 24 24"><path d="M6 4h10a2 2 0 012 2v14H8a2 2 0 01-2-2zM9 8h6M9 12h6M9 16h3"/></svg>',
};
const TABS = [['throne', 'Трон'], ['court', 'Двір'], ['factions', 'Фракції'], ['realm', 'Володіння'], ['chron', 'Хроніка']];
const S = { view: 'throne', picks: {}, deeds: 2, confirm: false, sceneStep: 0, sceneFor: null, build: 0, door: null, cut: {} };

const RES = [['Скриня', 84, -22], ['Харчі', 61, -6], ['Клинки', 140, 0], ['Слава', 48, +3]];
const MATTERS = [
  { id: 'pay', from: 'Справа держави · скриня спорожніє за 4 ходи', title: 'Затримана платня',
    txt: 'Третій тиждень рота чекає на срібло. Скарбник Тиміш Грек приніс рахункову книгу мовчки й поклав розгорнутою: на повну платню бракує сорока гривень. У таборі вже лічать чужі гаманці.',
    opts: [
      { t: 'Доплатити з власної частки', m: ['Скриня −40', 'Лояльність роти +2'], out: ['full', 'Без кидка', 'Срібло роздали при вогнищах. Про це говоритимуть довго, і це вже вчетверте.'] },
      { t: 'Пообіцяти здобич з наступного контракту', m: ['Обіцянка: борг роті'], roll: 'Вплив +3', out: ['part', '2d6: 4 + 3, Вплив +3 = 10 · так, але', 'Рота повірила, проте десятники зажадали слова при свідках. Обіцянку записано: не сплатиш до зими, лояльність упаде вдвічі сильніше.'] },
      { t: 'Продати обозних коней', m: ['Скриня +55', 'Харчі −15'], off: 'Недоступно: коней заставлено Ладомиру (хід 5)' },
    ] },
  { id: 'envoy', from: 'Подія з колоди', title: 'Посланець Ладомира',
    txt: 'Радник Вільного міста, сухий чоловік у хутрі не по сезону, привіз пропозицію: стерегти Кам’яний міст до весни. Платять справно. Та міст стоїть на землі, яку Дім Крижевських вважає своєю.',
    opts: [
      { t: 'Прийняти контракт', m: ['Скриня +60 за хід', 'Крижевські −3', 'Ладомир +2'], out: ['full', 'Без кидка', 'Грамоту скріплено. Попелясті стають на мості, а в замку Крижевських того ж вечора гасять свічки пізніше, ніж звичайно.'] },
      { t: 'Торгуватися через речника', m: ['Ставка: +80 або нічого'], roll: 'брат Севастян, Вплив +2', out: ['full', '2d6: 6 + 5, Вплив +2 = 13 · повний успіх', 'Брат Севастян тричі вставав з-за столу й тричі сідав назад. Місто платить вісімдесят і дає зимові квартири.'] },
      { t: 'Відмовити', m: ['Ладомир −2'], out: ['part', 'Без кидка', 'Радник поїхав не попрощавшись. Міст стерегтиме хтось інший, і цей хтось буде вам не другом.'] },
    ], scene: { t: 'Прийняти посланця самій', kind: 'Сцена: аудієнція', risk: null } },
  { id: 'lyakh', from: 'Справа двору · лояльність хорунжого −2', title: 'Хорунжий і чуже срібло',
    txt: 'Вивідниця Мокрина Сова бачила, як Давид Лях двічі виходив за частокіл після других півнів. Повертався без ліхтаря. Хтось перекуповує вашого хорунжого, або ж хорунжий перекуповує когось сам.',
    opts: [
      { t: 'Доручити Мокрині стежити', m: ['Безпечно', 'Відповідь наступного ходу'], roll: 'Мокрина Сова, Інтриги +3', out: ['part', '2d6: 3 + 4, Інтриги +3 = 10 · так, але', 'Мокрина простежила його до млина. Срібло справді чуже: гаманець із гербом Крижевських. Але Лях помітив тінь і тепер знає, що за ним ходять.'] },
      { t: 'Зняти з посади без розмов', m: ['Клинки −20', 'Лях стає ворогом'], out: ['part', 'Без кидка', 'Лях віддав корогву мовчки і забрав із собою двадцять шабель.'] },
    ], scene: { t: 'Викликати на розмову', kind: 'Сцена: розмова віч-на-віч', risk: null },
    deed: { t: 'Простежити самій, перевдягнувшись', kind: 'Особисте діяння', risk: 'Ризик: рана або викриття', roll: 'ваші Інтриги +1' } },
];
const SCENE = {
  stake: ['Повний успіх: Лях називає, хто платить, і лишається вашим.', 'Частковий: зізнається, але просить відпустити його з ротою половини загону.', 'Провал: заперечує все; лояльність −3, наступного ходу можливий заколот.'],
  lines: [
    ['n', 'Намет хорунжого пахне дьогтем і мокрою вовною. Давид Лях не встає, коли ви входите, тільки відкладає ремінь, який лагодив, і дивиться на ваші руки: чи порожні.'],
    ['n', '«Пізно ходиш, капітане, — каже він. — Чи то вже я пізно ходжу, і тобі про це донесли?»'],
  ],
  me: 'Сідаю навпроти, кладу на стіл гаманець із гербом Крижевських. «Мокрина знайшла це біля млина. Скажи мені сам, Давиде, поки я питаю як товариш».',
  after: ['n', 'Він довго мовчить. Пальці, що двадцять років тримали корогву, обмацують шов на гаманці, ніби шукають, де той розійдеться.'],
  roll: 'Ваш Вплив +3 · 2d6: 5 + 3 = 11 · так, але',
  end: '«Воєвода платить, щоб я не став на мості, коли прийде час, — каже Лях нарешті. — Я брав, бо ти платиш із власної кишені, а кишеня не бездонна. Відпусти мене з моїми людьми, і я поверну йому срібло в зуби».',
};

function nav(v) { S.view = v; S.confirm = false; render(); window.scrollTo(0, 0); }
function navBtns(host) {
  host.innerHTML = '';
  for (const [id, name] of TABS) {
    const b = el(`<button type="button">${ICON[id]}<span>${name}</span></button>`);
    const cur = S.view === id || (id === 'throne' && ['scene', 'dusk'].includes(S.view));
    if (cur) b.setAttribute('aria-current', 'page');
    b.onclick = () => nav(id); host.append(b);
  }
}
function header() {
  return `<header class="head">
    <div class="head-top">
      <button class="world" type="button" id="worldBtn">Вільна рота «Попелясті» <small>змінити світ ▾</small></button>
      <div class="turn">Хід 7 · осінь, рік другий<br>Ранг 2 з 5 · кондотьєр</div>
    </div>
    <div class="who">Капітан Орина Вересай</div>
    <div class="marks"><span>Зароблені імена:</span><span class="mark">Щедра</span><span class="mark">Донька страченого</span></div>
    <div class="res" aria-label="Ресурси">${RES.map(([n, v, d]) => `<div><span>${n}</span><b>${v}</b><i class="${d < 0 ? 'down' : d > 0 ? 'up' : ''}">${d === 0 ? 'без змін' : (d > 0 ? '+' : '−') + Math.abs(d) + ' за хід'}</i></div>`).join('')}</div>
  </header>`;
}
function cta(label, fn) { $('#ctaBar').hidden = !label; if (label) { $('#cta').textContent = label; $('#cta').onclick = fn; } }

const V = {};
V.throne = (m) => {
  m.append(el(header()));

    ['м’який', 'суворий', 'нещадний'].forEach((t, i) => { const b = el(`<button class="pick" type="button" aria-pressed="${i === 1}">${t}</button>`); b.onclick = () => { c.querySelectorAll('.pick').forEach((p) => p.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); }; c.append(b); });
    m.append(c); m.append(el('<span class="note">Сім коротких викликів моделі, приблизно хвилина. Чернетку можна правити.</span>'));
    cta('Збудувати світ', () => { S.build = 1; render(); tick(); }); return;
  }
  const done = S.build > STEPS.length;
  m.append(el(`<div><h2>${done ? 'Чернетка світу' : 'Будую світ…'}</h2><p class="note">${done ? 'Приберіть зайве. Усе можна змінити й пізніше у розділі світу.' : 'Крок за кроком; якщо модель не відповість, крок можна повторити.'}</p></div>`));
  m.append(el(`<section class="card"><ul class="steps">${STEPS.map((s, i) => `<li><span class="${i + 1 < S.build ? 'ok' : 'no'}">${i + 1 < S.build ? '✓' : i + 1 === S.build ? '…' : '○'}</span><span>${s}</span></li>`).join('')}</ul></section>`));
  if (done) {
    m.append(el('<section class="card"><div class="eyebrow">Задум</div><div class="txt">Пограниччя між Вільним містом і старою шляхтою. Ви — Орина Вересай, капітанка роти «Попелясті»: сорок шабель, порожня скриня і підроблена грамота.</div><div class="kv"><span>Ресурси</span><b>Скриня · Харчі · Клинки · Слава</b><span>Драбина</span><b>5 рангів до королеви</b><span>Хід</span><b>тиждень</b></div></section>'));
    const f = el('<section class="card"><div class="eyebrow">Фракції</div></section>');
    ['Вільне місто Ладомир', 'Дім Крижевських', 'Орден Сірого Хреста', 'Степові ватаги', 'Гільдія солеварів'].forEach((n) => { if (S.cut[n]) return; const r = el(`<div class="row" style="justify-content:space-between"><span>${n}</span><button class="btn ghost" type="button" aria-label="Прибрати: ${n}">Прибрати</button></div>`); $('button', r).onclick = () => { S.cut[n] = 1; render(); }; f.append(r); });
    if (Object.keys(S.cut).length) { const u = el('<button class="btn ghost" type="button">Повернути прибране</button>'); u.onclick = () => { S.cut = {}; render(); }; f.append(u); }
    m.append(f);
    m.append(el('<section class="card"><div class="eyebrow">Також готово</div><div class="kv"><span>Двір</span><b>4 людини</b><span>Колода</span><b>18 подій</b><span>Лорбук</span><b>31 запис</b><span>Документ світу</span><b>6 сторінок</b></div></section>'));
    cta('Почати правління', () => { S.door = null; S.build = 0; nav('throne'); });
  } else cta(null);
};
function tick() { if (S.view !== 'create' || S.build > STEPS.length) return; setTimeout(() => { S.build++; render(); tick(); }, 600); }

function render() {
  const m = $('#main'); m.innerHTML = '';
  navBtns($('#railBtns')); navBtns($('#tabs'));
  V[S.view](m);
  const side = $('#side'); side.innerHTML = '';
  if (!['court', 'create', 'fall'].includes(S.view)) side.append(sheet());
  const w = $('#worldBtn'); if (w) w.onclick = () => { S.door = null; nav('create'); };
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.confirm) { S.confirm = false; render(); } });
render();
</script>
