<title>Kingmaker Story Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a stage (picture of the place, the speaker's portrait standing in it) over a dialogue box with
   story choices; one matter at a time, a strip of portraits for the whole turn. Shell tokens, dark first. */
:root{
  --deep:#07080b;--base:#0b0c11;--panel:#0e1016;--raised:#12141c;--ink:#f0e9dc;--muted:#a9b1c4;--faint:#7e859a;
  --line:#2a2f3d;--accent:#e2213a;--cta:#39d5ff;--cta-ink:#07080b;--tonal:rgb(57 213 255 / .12);
  --danger:#f2777a;--danger-soft:rgb(242 119 122 / .16);--success:#7fd18b;--warning:#e3b341;--warning-soft:rgb(227 179 65 / .14);
  --hover:rgb(240 233 220 / .06);--on-pic:#f0e9dc;--scrim:rgb(7 8 11 / .66);
  --prose:"Literata",Georgia,"Times New Roman",serif;--ui:"Manrope",system-ui,"Segoe UI",sans-serif;color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --deep:#f4f4f6;--base:#ffffff;--panel:#fafafb;--raised:#ffffff;--ink:#17171a;--muted:#5a5a63;--faint:#74747e;
  --line:#e2e2e7;--accent:#c41a30;--cta:#2f5fbf;--cta-ink:#ffffff;--tonal:rgb(47 95 191 / .1);
  --danger:#c4373a;--danger-soft:rgb(196 55 58 / .12);--success:#2f7d3f;--warning:#9a6f0a;--warning-soft:rgb(154 111 10 / .12);
  --hover:rgb(0 0 0 / .05);color-scheme:light}}
:root[data-theme="light"]{
  --deep:#f4f4f6;--base:#ffffff;--panel:#fafafb;--raised:#ffffff;--ink:#17171a;--muted:#5a5a63;--faint:#74747e;
  --line:#e2e2e7;--accent:#c41a30;--cta:#2f5fbf;--cta-ink:#ffffff;--tonal:rgb(47 95 191 / .1);
  --danger:#c4373a;--danger-soft:rgb(196 55 58 / .12);--success:#2f7d3f;--warning:#9a6f0a;--warning-soft:rgb(154 111 10 / .12);
  --hover:rgb(0 0 0 / .05);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--deep);color:var(--ink);font:14px/1.5 var(--ui)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:1fr;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail,.side{display:none}
.main{min-width:0;max-width:820px;width:100%;margin:0 auto;padding-block:12px 96px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.top b{font-family:var(--prose);font-size:18px}
.top span{color:var(--muted);font-size:13px}
/* stage */
.stage{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#0b0c11;border:1px solid var(--line)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:8px;flex-wrap:wrap}
.hud span{background:var(--scrim);color:var(--on-pic);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud i{font-style:normal;opacity:.75;font-weight:500}
.place{position:absolute;right:8px;bottom:8px;background:var(--scrim);color:var(--on-pic);border-radius:6px;padding:2px 8px;font-size:12px}
.cast{position:absolute;left:14px;bottom:0;display:flex;align-items:flex-end;gap:10px}
.cast .pt{width:92px;border-radius:10px 10px 0 0;border:2px solid var(--on-pic);border-bottom:0;box-shadow:0 6px 24px rgb(0 0 0 / .5)}
.pt{display:block;border-radius:10px;overflow:hidden;background:#222;flex:none}
.pt svg{display:block;width:100%;height:auto}
.title-on{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgb(7 8 11 / .88));color:var(--on-pic)}
.title-on h2{font-family:var(--prose);font-size:22px;font-weight:600;text-wrap:balance}
.title-on div{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
/* dialogue */
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.plate{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.plate b{font-size:15px}
.plate span{color:var(--faint);font-size:12px}
.speech{font-family:var(--prose);font-size:16px;line-height:1.65;max-width:65ch}
.narr{font-family:var(--prose);font-style:italic;color:var(--muted);font-size:15px;line-height:1.6;max-width:65ch}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
h2{font-family:var(--prose);font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:48px}
.ch:hover:not(:disabled){background:var(--hover);border-color:var(--faint)}
.ch b{font-weight:600;font-size:15px}
.ch .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ch:disabled{opacity:.55;cursor:not-allowed}
.ch.self{border-color:var(--cta);background:var(--tonal)}
.chip{border-radius:999px;padding:1px 8px;border:1px solid var(--line);white-space:nowrap}
.chip.risk{border-color:var(--warning);background:var(--warning-soft);color:var(--warning)}
.chip.me{border-color:var(--cta);color:var(--cta)}
.own{display:flex;gap:8px}
.own input{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;min-height:44px}
.btn{border:1px solid var(--line);background:none;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink);font-weight:700;min-height:48px;font-size:15px}
.btn.tonal{background:var(--tonal);border-color:var(--cta);color:var(--cta)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted)}
/* turn strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px}
.beat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;min-height:44px;white-space:nowrap;flex:none}
.beat .pt{width:34px;height:34px;border-radius:50%}
.beat .pt svg{margin-top:-4px}
.beat[aria-current="step"]{border-color:var(--ink);background:var(--raised)}
.beat small{color:var(--faint)}
.beat .done{color:var(--success);font-weight:700}
.glyph{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line);font-family:var(--prose);font-weight:600}
.callout{border:1px solid var(--warning);background:var(--warning-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.callout.bad{border-color:var(--danger);background:var(--danger-soft)}
.dice{display:flex;gap:6px;align-items:center}
.die{width:34px;height:34px;border-radius:7px;background:var(--ink);color:var(--deep);display:grid;place-items:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.band{font-weight:700}.band.full{color:var(--success)}.band.part{color:var(--warning)}.band.miss{color:var(--danger)}
.say{align-self:flex-end;background:var(--tonal);border-radius:12px 12px 2px 12px;padding:10px 14px;max-width:85%;font-family:var(--prose);font-size:15px}
.res-card{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.res-card .pt{width:56px}
.rumour{border-left:2px solid var(--line);padding-left:12px;font-family:var(--prose);font-style:italic;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.pcard .pt{border-radius:0;width:100%}
.pcard div{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.kv span{color:var(--muted)}.kv b{font-variant-numeric:tabular-nums}
.up{color:var(--success)}.down{color:var(--danger)}
.mark{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.fr{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.fr svg{width:56px;height:auto;display:block}
.bar{display:flex;gap:3px}.bar i{width:18px;height:8px;border-radius:2px;background:var(--line)}.bar i.on{background:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:20px 1fr;gap:8px}
.ok{color:var(--success)}.no{color:var(--faint)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--base);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs button,.rail button{background:none;border:0;min-height:56px;font-size:12px;color:var(--muted);font-weight:600}
.tabs button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
@media (min-width:900px){
  .app{grid-template-columns:170px minmax(0,1fr);gap:24px}
  .rail{display:flex;flex-direction:column;gap:4px;padding-block:16px;position:sticky;top:0;align-self:start}
  .rail .brand{font-family:var(--prose);font-size:18px;font-weight:600;padding:8px 12px 16px}
  .rail button{text-align:left;min-height:44px;padding:0 12px;border-radius:8px;font-size:14px}
  .rail button[aria-current="page"]{color:var(--ink);box-shadow:inset 2px 0 0 var(--accent);background:var(--hover)}
  .tabs{display:none}.main{padding-block:16px 40px}
  .stage{aspect-ratio:16/7}.cast .pt{width:124px}
}
@media (min-width:1200px){
  .app{grid-template-columns:170px minmax(0,1fr) 260px}
  .side{display:flex;flex-direction:column;gap:12px;padding-block:16px;position:sticky;top:0;align-self:start}
}
@media (prefers-reduced-motion:no-preference){.in{animation:i .3s ease-out}@keyframes i{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="app">
  <nav class="rail" aria-label="Розділи"><div class="brand">Kingmaker <span class="note">макет 2</span></div><div id="railBtns"></div></nav>
  <main class="main" id="main"></main>
  <aside class="side" id="side"></aside>
</div>
<nav class="tabs" id="tabs" aria-label="Розділи"></nav>

<script>
// Clickable mock 2: the front as an interactive story. Every picture here is drawn by code (the tier that
// is always there); a card's portrait or a drawn picture would sit in the same frames. Fixed dice, no engine.
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };

// ---- pictures drawn by code ----
const WHO = {
  orina: { n: 'Орина Вересай', r: 'капітан роти', bg: '#5a1f2a', skin: '#d9b08c', hair: '#2b1a14', cloth: '#5d6470', style: 'long', sash: '#e2213a' },
  tymish: { n: 'Тиміш Грек', r: 'скарбник', bg: '#22384a', skin: '#c99a76', hair: '#8a8f99', cloth: '#5a4632', style: 'beard' },
  mokryna: { n: 'Мокрина Сова', r: 'вивідниця', bg: '#1f3a2b', skin: '#e0bd9c', hair: '#1c1c22', cloth: '#2c3340', style: 'hood' },
  lyakh: { n: 'Давид Лях', r: 'хорунжий', bg: '#4a3a1f', skin: '#c48e6a', hair: '#3a2a1c', cloth: '#6b2f2a', style: 'short', wide: 1 },
  sevastian: { n: 'брат Севастян', r: 'речник', bg: '#35284a', skin: '#d6ab88', hair: '#6b5a45', cloth: '#3b3b3b', style: 'beard' },
  envoy: { n: 'Радник Ладомира', r: 'посланець міста', bg: '#4d4726', skin: '#dcc0a4', hair: '#7a5a3a', cloth: '#2e4a5a', style: 'hat' },
};
function portrait(id) {
  const p = WHO[id];
  const hair = {
    short: `<path d="M33 50Q34 30 50 30Q66 30 67 50Q60 40 50 40Q40 40 33 50Z" fill="${p.hair}"/>`,
    long: `<path d="M32 52Q32 27 50 27Q68 27 68 52L71 88Q62 80 62 60Q58 42 50 42Q42 42 38 60Q38 80 29 88Z" fill="${p.hair}"/>`,
    hood: `<path d="M24 90Q22 24 50 22Q78 24 76 90Q67 72 66 54Q64 36 50 36Q36 36 34 54Q33 72 24 90Z" fill="${p.cloth}"/><path d="M34 54Q36 38 50 38Q64 38 66 54Q60 44 50 44Q40 44 34 54Z" fill="${p.hair}"/>`,
    beard: `<path d="M34 54Q50 88 66 54Q61 64 50 64Q39 64 34 54Z" fill="${p.hair}"/>`,
    hat: `<path d="M29 44Q28 20 50 20Q72 20 71 44Q50 34 29 44Z" fill="${p.hair}"/><rect x="28" y="40" width="44" height="7" rx="3" fill="#2a2018"/>`,
  }[p.style];
  const sh = p.wide ? 'M2 120Q6 82 50 78Q94 82 98 120Z' : 'M10 120Q12 85 50 81Q88 85 90 120Z';
  return `<span class="pt" role="img" aria-label="${p.n}"><svg viewBox="0 0 100 120"><rect width="100" height="120" fill="${p.bg}"/><circle cx="50" cy="50" r="40" fill="#fff" opacity=".07"/><path d="${sh}" fill="${p.cloth}"/>${p.sash ? `<path d="M22 120L60 82L70 86L36 120Z" fill="${p.sash}"/>` : ''}<rect x="44" y="64" width="12" height="18" fill="${p.skin}"/><rect x="44" y="64" width="12" height="8" fill="#000" opacity=".18"/><ellipse cx="50" cy="52" rx="16" ry="19" fill="${p.skin}"/><path d="M50 33A16 19 0 0 1 50 71Z" fill="#000" opacity=".12"/>${hair}</svg></span>`;
}
const sky = (id, a, b, c) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".62" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><rect width="800" height="360" fill="url(#${id})"/>`;
const tent = (x, y, s, lit) => `<path d="M${x} ${y}L${x - 46 * s} ${y + 70 * s}L${x + 46 * s} ${y + 70 * s}Z" fill="#1a1d27"/><path d="M${x} ${y + 22 * s}L${x - 9 * s} ${y + 70 * s}L${x + 9 * s} ${y + 70 * s}Z" fill="${lit ? '#f2a03d' : '#0c0d12'}"/>`;
const SCENES = {
  camp: `${sky('g1', '#131a33', '#5b2f45', '#d9743a')}<circle cx="640" cy="84" r="26" fill="#f3e3c3" opacity=".9"/><path d="M0 250Q150 190 300 235T620 215T800 240V360H0Z" fill="#23202f"/><path d="M0 280Q200 240 420 270T800 262V360H0Z" fill="#14131c"/>${tent(180, 196, 1.1, 1)}${tent(330, 214, .8)}${tent(600, 204, 1, 1)}${tent(480, 226, .7)}<circle cx="404" cy="292" r="46" fill="#f2a03d" opacity=".18"/><path d="M396 296L404 268L412 296Z" fill="#f6c15a"/><rect x="258" y="120" width="4" height="150" fill="#0c0d12"/><path d="M262 124L318 136L262 156Z" fill="#8d9099"/><path d="M262 140L300 144L262 152Z" fill="#e2213a"/><path d="M0 300H800V360H0Z" fill="#0b0b10"/>`,
  ledger: `${sky('g2', '#1a1410', '#3a2414', '#1a1210')}<circle cx="560" cy="120" r="150" fill="#f2a03d" opacity=".16"/><path d="M0 0L400 -40L800 0V40Q400 10 0 40Z" fill="#0d0a08"/><rect x="396" y="0" width="8" height="250" fill="#0d0a08"/><rect x="556" y="96" width="10" height="30" fill="#2a1c10"/><circle cx="561" cy="92" r="12" fill="#f6c15a"/><path d="M120 262H680L720 360H80Z" fill="#2b1d12"/><path d="M300 236L420 226L500 250L380 262Z" fill="#d9c9a6"/><path d="M400 229V258" stroke="#8a7a5a" stroke-width="2"/><circle cx="560" cy="250" r="16" fill="#8d6b2a"/><circle cx="592" cy="256" r="10" fill="#a8842f"/>`,
  gate: `${sky('g3', '#27324a', '#8a6a5a', '#e0a070')}<path d="M0 250H800V360H0Z" fill="#191821"/><path d="M220 250V110H260V90H280V110H320V90H340V110H380V250Z" fill="#232230"/><path d="M420 250V130H460V110H480V130H520V110H540V130H580V250Z" fill="#1d1c28"/><path d="M360 250V190A40 40 0 0 1 440 190V250Z" fill="#0d0c12"/><rect x="298" y="60" width="4" height="40" fill="#0d0c12"/><path d="M302 62L340 70L302 82Z" fill="#2e6a8a"/><path d="M0 268Q400 240 800 268V360H0Z" fill="#100f16"/><path d="M380 360L392 262H408L420 360Z" fill="#2a2731"/>`,
  mill: `${sky('g4', '#070b18', '#111a33', '#1b2440')}<circle cx="160" cy="70" r="20" fill="#dfe6f5" opacity=".85"/><g fill="#dfe6f5" opacity=".6"><circle cx="420" cy="40" r="1.5"/><circle cx="520" cy="90" r="1.5"/><circle cx="700" cy="50" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="620" cy="130" r="1.5"/></g><path d="M0 270Q300 230 800 262V360H0Z" fill="#0b0f1c"/><path d="M500 262L520 140H580L600 262Z" fill="#141a2c"/><path d="M510 140L550 104L590 140Z" fill="#0f1422"/><g stroke="#1c2438" stroke-width="10" stroke-linecap="round"><path d="M550 132L470 60"/><path d="M550 132L640 70"/><path d="M550 132L610 216"/><path d="M550 132L476 200"/></g><rect x="540" y="216" width="18" height="24" fill="#f2a03d"/><path d="M0 300Q200 280 380 300T800 296V360H0Z" fill="#070a13"/>`,
  tent: `${sky('g5', '#1c130e', '#40261a', '#1a110c')}<path d="M0 0L400 60L800 0V26L400 96L0 26Z" fill="#0f0a07"/><rect x="394" y="60" width="12" height="300" fill="#0f0a07"/><circle cx="210" cy="150" r="130" fill="#f2a03d" opacity=".15"/><rect x="204" y="96" width="12" height="40" fill="#2a1c10"/><circle cx="210" cy="140" r="14" fill="#f6c15a"/><path d="M460 280H760L780 360H440Z" fill="#2b1d12"/><rect x="560" y="262" width="60" height="16" rx="4" fill="#6b2f2a"/><path d="M0 320H800V360H0Z" fill="#0d0907"/>`,
  dusk: `${sky('g6', '#1b1730', '#7a3040', '#e0743a')}<circle cx="400" cy="250" r="70" fill="#f6c15a" opacity=".9"/><path d="M0 250Q200 200 400 248T800 230V360H0Z" fill="#1c1826"/>${tent(150, 214, .9)}${tent(660, 206, 1)}<rect x="398" y="150" width="4" height="120" fill="#0c0d12"/><path d="M402 154L458 166L402 186Z" fill="#8d9099"/><path d="M0 296H800V360H0Z" fill="#0b0a10"/>`,
  bridge: `${sky('g7', '#0d1420', '#2b3648', '#566070')}<g fill="#fff" opacity=".7"><circle cx="90" cy="60" r="2"/><circle cx="210" cy="140" r="2"/><circle cx="350" cy="50" r="2"/><circle cx="470" cy="120" r="2"/><circle cx="610" cy="70" r="2"/><circle cx="730" cy="150" r="2"/><circle cx="150" cy="210" r="2"/><circle cx="560" cy="200" r="2"/><circle cx="680" cy="240" r="2"/><circle cx="300" cy="230" r="2"/></g><path d="M0 230H800V262H0Z" fill="#1b1f2a"/><path d="M80 262A90 80 0 0 1 260 262ZM310 262A90 80 0 0 1 490 262ZM540 262A90 80 0 0 1 720 262Z" fill="#566070"/><path d="M0 262H800V360H0Z" fill="#232b38"/><path d="M0 226H800V232H0Z" fill="#dfe6f5" opacity=".8"/><path d="M430 228L470 196L476 202L440 232Z" fill="#8d9099"/><path d="M452 212L470 198L474 204Z" fill="#e2213a"/>`,
